apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: taskboard
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: TaskBoard
        orgId: 1
        folder: TaskBoard
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/taskboard
