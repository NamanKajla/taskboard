apiVersion: v1
kind: ConfigMap
metadata:
  name: taskboard-prometheus-config
  namespace: taskboard
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: taskboard-backend
        metrics_path: /metrics
        static_configs:
          - targets: ["taskboard-backend:8000"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: taskboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --web.enable-lifecycle
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
      volumes:
        - name: config
          configMap:
            name: taskboard-prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: taskboard
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
